name: arrendis

services:
  backend:
    build:
      context: ..
      dockerfile: cicd/Dockerfile
    restart: always
    env_file: ../.env
    environment:
      - ENVIRONMENT=production
    volumes:
      - ../data:/app/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
