<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Página no encontrada | Arrendis</title>
    <meta name="description" content="La página solicitada no existe o ha sido trasladada. Arrendis — Gestión de Alquileres." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --bg-primary: #f9f7f5;
        --bg-secondary: #ffffff;
        --text-primary: #1c1917;
        --text-secondary: #57534e;
        --text-muted: #8c827a;
        --brand-burgundy: #6b0008;
        --panel-border: #e5e2dd;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 100vh;
      }
      header {
        border-bottom: 1px solid var(--panel-border);
        background: var(--bg-secondary);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        font-family: 'Times New Roman', Times, serif;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--brand-burgundy);
        text-decoration: none;
      }
      main {
        max-width: 600px;
        margin: 4rem auto;
        padding: 0 1rem;
        text-align: center;
      }
      .code {
        font-family: monospace;
        font-size: 0.85rem;
        color: var(--brand-burgundy);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-family: 'Times New Roman', Times, serif;
        font-size: 2.5rem;
        font-weight: 500;
        margin: 0 0 1rem 0;
      }
      p {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .btn {
        display: inline-block;
        padding: 0.65rem 1.25rem;
        font-size: 0.85rem;
        border-radius: 4px;
        text-decoration: none;
        font-family: monospace;
        transition: background-color 0.15s ease;
      }
      .btn-primary {
        background: var(--text-primary);
        color: var(--bg-primary);
      }
      .btn-primary:hover {
        background: #292524;
      }
      footer {
        border-top: 1px solid var(--panel-border);
        padding: 1.5rem;
        text-align: center;
        font-family: monospace;
        font-size: 0.75rem;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/" class="brand">ARRENDIS</a>
    </header>
    <main>
      <div class="code">404 · Error de Navegación</div>
      <h1>Página no encontrada</h1>
      <p>
        La dirección que ha solicitado no existe, ha sido trasladada o el enlace
        utilizado contiene una errata. Su cartera e información fiscal permanecen
        plenamente seguras.
      </p>
      <a href="/" class="btn btn-primary">Volver al Inicio</a>
    </main>
    <footer>
      © 2026 Arrendis · Atelier Editorial
    </footer>
  </body>
</html>
