<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    :root {
      --mark-stroke: #6b0008;
      --mark-opacity: 0.75;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --mark-stroke: #f7a9af;
        --mark-opacity: 0.85;
      }
    }
  </style>
  <!-- Foundation line -->
  <line x1="3" y1="28" x2="29" y2="28" stroke="var(--mark-stroke)" stroke-width="2" stroke-linecap="square" />
  
  <!-- Outer monumental portal arch -->
  <path
    d="M6 28V14C6 8.477 10.477 4 16 4C21.523 4 26 8.477 26 14V28"
    stroke="var(--mark-stroke)"
    stroke-width="2"
    stroke-linecap="square"
  />

  <!-- Inner masonry recess -->
  <path
    d="M10.5 28V15C10.5 11.962 12.962 9.5 16 9.5C19.038 9.5 21.5 11.962 21.5 15V28"
    stroke="var(--mark-stroke)"
    stroke-width="1.5"
    stroke-opacity="var(--mark-opacity)"
  />

  <!-- Keystone notch / Clave de bóveda -->
  <line x1="16" y1="4" x2="16" y2="8" stroke="var(--mark-stroke)" stroke-width="2" />

  <!-- Central datum point -->
  <circle cx="16" cy="19" r="1.4" fill="var(--mark-stroke)" />
</svg>
